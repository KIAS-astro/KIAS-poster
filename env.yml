name: kias-poster
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cairosvg      # SVG -> PNG/PDF (pulls in the cairo system library)
  - pillow        # image loading / compositing
  - numpy         # masks and blending
  - pypdf         # clickable link annotation on the PDF
  - qrcode        # registration QR code
  # Korean glyphs: macOS uses the system "Apple SD Gothic Neo". On Linux,
  # install a CJK font, e.g. add:  - google-noto-sans-cjk-fonts
